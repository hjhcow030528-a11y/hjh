name: Build parquet_to_csv.exe (Windows)

on:
  push:
    branches:
      - claude/parquet-to-csv-converter-xTWF3
      - main
    paths:
      - parquet_to_csv.py
      - requirements.txt
      - build_parquet_to_csv.bat
      - .github/workflows/build-parquet-to-csv.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable with PyInstaller
        shell: cmd
        run: |
          pyinstaller ^
            --noconfirm ^
            --onefile ^
            --name parquet_to_csv ^
            --hidden-import tkinter ^
            --collect-submodules pyarrow ^
            --collect-submodules pandas ^
            parquet_to_csv.py

      - name: Verify build output
        shell: cmd
        run: |
          if not exist "dist\parquet_to_csv.exe" (
            echo [ERROR] dist\parquet_to_csv.exe not found
            exit /b 1
          )
          dir dist

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: parquet_to_csv-windows
          path: dist/parquet_to_csv.exe
          if-no-files-found: error
          retention-days: 30
